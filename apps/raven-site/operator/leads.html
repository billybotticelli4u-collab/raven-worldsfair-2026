<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operator — leads</title><link rel="stylesheet" href="../_shared-style.css">
<style>table{border-collapse:collapse;font-size:11.5px;margin-top:16px;width:100%}td,th{border:1px solid var(--line);padding:4px 7px;text-align:left;color:var(--dim)}th{color:var(--text)}td.y{color:var(--pass)}td.n{color:var(--risk)}</style></head><body>
<header><div class="wrap"><b>RAVEN / operator / leads</b></div></header>
<div class="wrap"><h1>Leads</h1>
<p class="lead">Load <span class="mono">private/leads.json</span> (gitignored — stays in your browser). Field contract: <a href="leads-template.json" class="mono">leads-template.json</a>. Every field exists because it teaches us what to build next.</p>
<input type="file" id="load" accept=".json" style="color:var(--dim)">
<div id="out"></div></div>
<script>
const COLS=[["leadId","id"],["dateReceived","received"],["role","role"],["tokenRequested","token"],["verdictSent","verdict sent"],["verdict","verdict"],["missingEvidence","missing evidence"],["preferredAccessPath","path"],["holderBetaRequested","β req"],["apiKeyIssued","key"],["holderBetaEnabled","β on"],["actualUsageCount","uses"],["repeatUsage","repeat"],["followUpDate","follow-up"],["paidStatus","paid"],["nextRequestedFeature","next feature"]];
document.getElementById('load').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const d=JSON.parse(rd.result);
    let h='<table><tr>'+COLS.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr>';
    for(const l of d.leads){h+='<tr>'+COLS.map(c=>{let v=l[c[0]];
      if(Array.isArray(v))v=v.join(', ');
      if(v===true)return'<td class="y">yes</td>';if(v===false)return'<td class="n">no</td>';
      return'<td>'+(v??'')+'</td>';}).join('')+'</tr>';}
    document.getElementById('out').innerHTML=h+'</table>';};
  rd.readAsText(f);});
</script></body></html>
