# I-3 post-deploy / PR gate — Owner must mark this check Required on main.
# Secrets:
#   VERCEL_TOKEN + VERCEL_PROJECT_ID (+ optional VERCEL_TEAM_ID) — resolve exact preview for PR/push head commit
#   JUDGE_VERIFY_COOKIE (optional)
#   VERCEL_AUTOMATION_BYPASS_SECRET (Vercel Protection Bypass for Automation)
#   JUDGE_VERIFY_BASE_URL (optional; if set on PR must match exact preview for head — never production)
# Never echo secrets. Never treat skip as PASS. Never fall back to production.
name: verify-judge-url

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to verify"
        required: true
        type: string
      expected_commit:
        description: "40-hex commit that must match fairBuildCommit"
        required: true
        type: string

concurrency:
  group: verify-judge-url-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve exact preview URL and expected commit
        id: url
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_STATE: ${{ github.event.deployment_status.state }}
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          DEPLOY_SHA: ${{ github.event.deployment.sha || github.event.deployment_status.deployment.sha }}
          INPUT_URL: ${{ inputs.base_url }}
          INPUT_COMMIT: ${{ inputs.expected_commit }}
          SECRET_URL: ${{ secrets.JUDGE_VERIFY_BASE_URL }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          set -euo pipefail
          node scripts/ci/resolve-judge-verify-target.mjs

      - name: Run verify-judge-url harness
        if: steps.url.outputs.skip != 'true'
        env:
          VERIFY_JUDGE_COOKIE: ${{ secrets.JUDGE_VERIFY_COOKIE }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERIFY_JUDGE_PROTECTION_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          BASE: ${{ steps.url.outputs.base }}
          EXPECTED_COMMIT: ${{ steps.url.outputs.expected }}
        run: |
          set -euo pipefail
          # Cookie and/or Vercel automation bypass unlock protected previews.
          # Bypass is sent as x-vercel-protection-bypass only to the intended origin.
          # Never echo secrets.
          node scripts/verify-judge-url.mjs "$BASE" | tee harness-out.txt

      - name: Upload harness log
        if: always() && steps.url.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verify-judge-url-log
          path: harness-out.txt

      - name: Non-success deployment notice
        if: steps.url.outputs.skip == 'true'
        run: |
          echo "::error::Verification was skipped in a required gate"
          exit 1
